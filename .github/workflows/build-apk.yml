name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: 准备 Android 工程
        run: flutter create --platforms=android --project-name italian_daily /tmp/italian_daily && cp -r /tmp/italian_daily/android .
      - name: 拉取依赖并打包
        run: flutter pub get && flutter build apk --debug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
