name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter create --platforms=android .
      - name: 强制修改安卓 SDK 版本和权限
        run: |
          python3 - <<'PY'
          import os, re
          # 修改 Gradle 配置
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(f):
                  with open(f, 'r') as file:
                      content = file.read()
                  content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', content)
                  content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', content)
                  content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 34', content)
                  content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 34', content)
                  if 'namespace' not in content and f.endswith('.kts'):
                      content = content.replace('android {', 'android {\n    namespace = "com.example.italian_daily"')
                  with open(f, 'w') as file:
                      file.write(content)
          # 添加权限
          p = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(p):
              s = open(p).read()
              extra = '''    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
    <uses-permission android:name="android.permission.INTERNET"/>
'''
              s = s.replace('<application', extra + '    <application', 1)
              open(p, 'w').write(s)
          PY
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
