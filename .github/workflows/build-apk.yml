name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: 生成 Android 工程
        run: flutter create --platforms=android --project-name italian_daily /tmp/italian_daily

      - name: 复制 Android 工程到仓库
        run: cp -r /tmp/italian_daily/android .

      - name: 添加录音和 TTS 权限
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          extra = '''    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
    <uses-permission android:name="android.permission.INTERNET"/>
    <queries>
        <intent>
            <action android:name="android.intent.action.TTS_SERVICE" />
        </intent>
    </queries>
'''
          s = s.replace('<application', extra + '    <application', 1)
          open(p, 'w').write(s)
          PY

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 debug APK
        run: flutter build apk --debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
